<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Polar · Open Daymark</title><style>body{font:16px system-ui;background:#f8faf7;color:#283b34;max-width:560px;margin:10vh auto;padding:22px}article{background:white;border:1px solid #e1e8e1;border-radius:14px;padding:25px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cad8ca;border-radius:8px;margin:8px 0 15px}button{background:#507d5d;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}code{overflow-wrap:anywhere}small{color:#65776b}</style><article><h1>Connect Polar</h1><div id="start"><p>Enter your Polar Client ID (not the secret) to authorize Open Daymark.</p><label for="id">Client ID</label><input id="id" autocomplete="off"><button id="authorize">Authorize with Polar</button></div><div id="done" hidden><p id="status"></p><p>Copy the one-time code into the GitHub Actions repository secret named <code>POLAR_AUTH_CODE</code>. Never share it publicly. It expires quickly.</p><code id="code"></code><p><button id="copy">Copy code</button></p></div><small>Authorization codes and credentials are not stored by this page.</small></article><script>(()=>{const p=new URLSearchParams(location.search),code=p.get("code"),err=p.get("error"),redirect=location.origin+location.pathname;if(code||err){document.getElementById("start").hidden=true;document.getElementById("done").hidden=false;document.getElementById("status").textContent=err?"Polar returned an error: "+err:"Polar authorization succeeded.";document.getElementById("code").textContent=code||"";document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(code||"");history.replaceState(null,"",location.pathname);return}document.getElementById("authorize").onclick=()=>{const id=document.getElementById("id").value.trim();if(!id)return;const scope="activity:read training_sessions:read sleep:read nightly_recharge:read";const u=new URL("https://auth.polar.com/oauth/authorize");u.searchParams.set("client_id",id);u.searchParams.set("response_type","code");u.searchParams.set("scope",scope);u.searchParams.set("redirect_uri",redirect);location.href=u.href}})()</script></html>
