<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Daymark</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;color:#283b34;background:#f8faf7}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:36px 24px 75px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:42px}.brand{font-size:21px;font-weight:700;letter-spacing:-.5px}.sub{color:#718079;font-size:13px}h1{font-size:32px;font-weight:650;letter-spacing:-1px;margin:0 0 7px}p{color:#697a70;margin:0 0 26px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:25px 0 35px}.card,.panel{border:1px solid #e4eae4;background:white;border-radius:14px}.card{padding:18px}.card .label{font-size:12px;color:#728077}.card .number{font-size:28px;font-weight:650;letter-spacing:-1px;margin:13px 0 3px}.card .date{font-size:11px;color:#849188}h2{font-size:19px;font-weight:650;letter-spacing:-.4px;margin:0}section{margin-top:30px}.section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel{padding:22px}select{border:1px solid #dbe5db;background:#fff;border-radius:8px;padding:9px 11px;color:#32483c;font:inherit;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}svg{width:100%;height:auto;display:block;touch-action:pan-y}.chartbox{position:relative}.chart-tip{position:absolute;z-index:2;pointer-events:none;background:#284338;color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;box-shadow:0 5px 15px #0002;max-width:210px;transform:translate(-50%,-110%);white-space:nowrap}.chart-tip[hidden]{display:none}.plot-options{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:#66786c;margin:0 0 10px}.plot-options label{display:flex;align-items:center;gap:5px}.plot-options input{accent-color:#73a586}.bar-hover{fill:#d5e5d9}.bar-chart{cursor:crosshair}.empty{padding:90px 10px;text-align:center;color:#829087}.legend,.note{font-size:12px;color:#809087;margin-top:10px}.legend{display:flex;gap:15px;flex-wrap:wrap}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{padding:15px 16px;border:1px solid #e4eae4;background:white;border-radius:11px;cursor:pointer;text-align:left;color:#34463b;font:inherit}.metric:hover,.metric:focus-visible{border-color:#a4c3ae;background:#f2f8f1}.metric strong{display:block;font-size:14px;font-weight:600}.metric small{display:block;color:#8a978e;margin-top:5px}footer{margin-top:45px;color:#89958b;font-size:12px}a{color:#547b62}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #eef1ed}th{color:#809087;font-weight:500}td:not(:first-child),th:not(:first-child){text-align:right}.tablewrap{overflow:auto}.chartbox{min-height:270px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.section-top{align-items:flex-start;flex-direction:column}.card .number{font-size:25px}}@media(max-width:430px){main{padding:25px 15px 55px}.metrics{grid-template-columns:1fr}.panel{padding:15px}}
</style></head><body><main><header><div class="brand">Open Daymark <span style="color:#83ab8b">✳</span></div><div class="sub">Personal metrics</div></header>
<h1>Overview</h1><p>My measurements and activity over time.</p>
<div id="cards" class="cards"></div>
<section><div class="section-top"><h2>History</h2><div class="controls"><select id="metric" aria-label="Metric"></select><select id="range" aria-label="Date range"><option value="all">All time</option><option value="90">90 days</option><option value="30">30 days</option></select></div></div><div class="panel"><div id="plot-options" class="plot-options"></div><div id="chart" class="chartbox"></div><div id="legend" class="legend"></div><div id="note" class="note"></div></div></section>
<section><div class="section-top"><h2>Recent entries</h2></div><div class="panel tablewrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></section>
<section><div class="section-top"><h2>Metrics</h2></div><div id="metrics" class="metrics"></div></section>
<footer>Open Daymark · <a href="./data.json">Data</a> · Observations are published snapshots, not a live feed. Dates and sources are shown for provenance.</footer>
</main><script>
(()=>{"use strict";const $=id=>document.getElementById(id),ns="http://www.w3.org/2000/svg",colors=["#73a586","#d6a66e","#809fc8","#b789aa"];let db,selected="weight";const el=(tag,txt,cls)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n},svg=(tag,attrs={},txt)=>{const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(txt!==undefined)n.textContent=txt;return n},fmt=(v,c)=>typeof v==="number"?v.toLocaleString("en-US",{maximumFractionDigits:c.precision??1,minimumFractionDigits:c.precision??0}):String(v),day=d=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),valid=m=>m.records.filter(r=>r.date&&r.values&&Object.values(r.values).some(v=>typeof v==="number"&&Number.isFinite(v)||typeof v==="string"&&v.trim())).sort((a,b)=>a.date.localeCompare(b.date)),metric=()=>db.metrics.find(m=>m.id===selected);
function init(){for(const id of ["weight","steps","distance","active_energy"]){const m=db.metrics.find(x=>x.id===id);if(!m)continue;const r=valid(m).at(-1),c=m.components[0],card=el("div",undefined,"card");card.append(el("div",m.label,"label"),el("div",r?fmt(r.values[c.key],c)+(c.unit==="lb"?" lb":c.unit==="mi"?" mi":c.unit==="kcal"?" kcal":""):"—","number"),el("div",r?day(r.date)+(r.status==="partial"?" · partial snapshot":"")+(m.lastSyncedOn?" · imported "+day(m.lastSyncedOn):""):"No entries","date"));$("cards").append(card)}for(const m of db.metrics){const opt=el("option",m.label);opt.value=m.id;$("metric").append(opt);const b=el("button",undefined,"metric");b.append(el("strong",m.label),el("small",valid(m).length+" entries"));b.addEventListener("click",()=>{selected=m.id;$("metric").value=m.id;$("range").value="all";render();document.getElementById("chart").scrollIntoView({behavior:"smooth",block:"center"})});$("metrics").append(b)}$("metric").value=selected;$("metric").addEventListener("change",e=>{selected=e.target.value;render()});$("range").addEventListener("change",render);render()}
function render(){const m=metric();let r=valid(m),period=$("range").value;if(period!=="all"&&r.length){const cutoff=new Date(r.at(-1).date+"T12:00:00");cutoff.setDate(cutoff.getDate()-Number(period)+1);r=r.filter(v=>new Date(v.date+"T12:00:00")>=cutoff)}
$("chart").replaceChildren();$("legend").replaceChildren();$("head").replaceChildren();$("rows").replaceChildren();$("plot-options").replaceChildren();
const tr=el("tr");tr.append(el("th","Date"));for(const c of m.components)tr.append(el("th",c.label));$("head").append(tr);
for(const v of r.slice(-10).reverse()){const tr=el("tr");tr.append(el("td",day(v.date)+(v.status==="partial"?" (partial)":"")));for(const c of m.components)tr.append(el("td",v.values[c.key]===undefined?"—":fmt(v.values[c.key],c)+(c.unit?" "+c.unit:"")));$("rows").append(tr)}
$("note").textContent=r.length?r.length+" observations · "+m.source+(m.lastSyncedOn?" · imported "+day(m.lastSyncedOn):"")+(r.some(v=>v.status==="partial")?" · includes a partial day":""):"No entries yet";if(!r.length){$("chart").append(el("div","No data yet","empty"));return}
if(m.kind==="categorical"){const key=m.components[0].key,counts=new Map();for(const v of r){const val=String(v.values[key]);counts.set(val,(counts.get(val)||0)+1)}const box=el("div");for(const [v,n] of [...counts].sort((a,b)=>b[1]-a[1])){const row=el("div",v+" · "+n+" observations");row.style.padding="10px";box.append(row)}$("chart").append(box);return}
const barIds=["steps","distance","active_energy","polar_steps","polar_active_energy","polar_activity","polar_workout_duration","polar_workout_hr_zones","polar_cardio_load","polar_training_load","polar_sleep_duration","polar_sleep_phases","polar_sleep_score","polar_nightly_hrv"];
const isBar=barIds.includes(m.id)||m.id.startsWith("polar_daily_")||m.id.startsWith("polar_sleep_");
const isWeight=m.id==="weight";
let showAvg=isWeight,showPoints=true;
const options=$("plot-options");
if(isWeight){const avg=el("label"),chk=el("input");chk.type="checkbox";chk.checked=true;chk.addEventListener("change",()=>{showAvg=chk.checked;draw()});avg.append(chk,document.createTextNode("7-day rolling average"));options.append(avg);const note=el("span","Measured points only · average uses available weigh-ins in the past 7 calendar days");options.append(note)}
if(!isBar&&!isWeight){const label=el("span","Each point is a recorded observation");options.append(label)}
function draw(){
$("chart").replaceChildren();$("legend").replaceChildren();
const series=m.components.map((c,i)=>({c,color:colors[i%colors.length],pts:r.filter(v=>typeof v.values[c.key]==="number"&&Number.isFinite(v.values[c.key])).map(v=>({date:v.date,value:v.values[c.key],recordId:v.recordId}))})).filter(s=>s.pts.length);
if(!series.length){$("chart").append(el("div","No numeric entries","empty"));return}
const all=series.flatMap(s=>s.pts),times=all.map(p=>Date.parse(p.date+"T12:00:00")),values=all.map(p=>p.value),w=820,h=295,L=65,R=20,T=20,B=40;
let low=Math.min(...values),high=Math.max(...values),spread=high-low||Math.max(1,Math.abs(high)*.1);
if(isBar)low=Math.min(0,low);else low-=spread*.12;high+=spread*.12;
const t0=Math.min(...times),t1=Math.max(...times),dayms=86400000;
const xmin=isBar?t0-dayms/2:t0,xmax=isBar?t1+dayms/2:t1;
const x=t=>L+(xmin===xmax?(w-L-R)/2:(t-xmin)/(xmax-xmin)*(w-L-R)),y=v=>T+(high-v)/(high-low)*(h-T-B);
const chart=svg("svg",{viewBox:"0 0 820 295",role:"img","aria-label":m.label+" recorded observations",class:"bar-chart"});
for(let i=0;i<5;i++){const yy=T+(h-T-B)*i/4;chart.append(svg("line",{x1:L,x2:w-R,y1:yy,y2:yy,stroke:"#e8eee8"}),svg("text",{x:L-10,y:yy+4,"text-anchor":"end",fill:"#839087","font-size":12},Number(high-(high-low)*i/4).toLocaleString("en-US",{maximumFractionDigits:1})))}
for(const [t,align] of [[t0,"start"],[t1,"end"]])chart.append(svg("text",{x:align==="start"?L:w-R,y:h-9,"text-anchor":align,fill:"#839087","font-size":12},day(new Date(t).toISOString().slice(0,10))));
const tip=el("div",undefined,"chart-tip");tip.hidden=true;
function showTip(e,p,s){tip.textContent=day(p.date)+(r.find(v=>v.date===p.date&&v.recordId===p.recordId)?.status==="partial"?" (partial)":"")+" · "+s.c.label+": "+fmt(p.value,s.c)+(s.c.unit?" "+s.c.unit:"");tip.hidden=false;const bounds=$("chart").getBoundingClientRect();tip.style.left=Math.max(80,Math.min(bounds.width-80,e.clientX-bounds.left))+"px";tip.style.top=Math.max(32,e.clientY-bounds.top-9)+"px"}
for(const [si,s] of series.entries()){
const n=series.length;const slot=Math.max(2,Math.min(28,(w-L-R)/Math.max(1,(xmax-xmin)/dayms+1)*.72));const bw=slot/n;
for(const p of s.pts){const px=x(Date.parse(p.date+"T12:00:00")),py=y(p.value);let node;
if(isBar){node=svg("rect",{x:px-slot/2+si*bw,y:py,width:Math.max(1,bw-.8),height:Math.max(1,y(low)-py),rx:2,fill:s.color})}
else{node=svg("circle",{cx:px,cy:py,r:isWeight?4.6:4,fill:s.color,stroke:"#fff","stroke-width":1})}
node.append(svg("title",{},day(p.date)+": "+fmt(p.value,s.c)+" "+s.c.unit));node.addEventListener("pointermove",e=>showTip(e,p,s));node.addEventListener("pointerleave",()=>tip.hidden=true);chart.append(node)}
const legend=el("span",s.c.label+(s.c.unit?" ("+s.c.unit+")":""));legend.style.setProperty("--c",s.color);$("legend").append(legend)}
if(isWeight&&showAvg){const s=series[0];const moving=s.pts.map(p=>{const t=Date.parse(p.date+"T12:00:00");const observed=s.pts.filter(v=>{const vtime=Date.parse(v.date+"T12:00:00");return vtime>=t-6*dayms&&vtime<=t});return {date:p.date,value:observed.reduce((sum,v)=>sum+v.value,0)/observed.length}});const path=moving.map((p,i)=>(i?"L":"M")+x(Date.parse(p.date+"T12:00:00")).toFixed(2)+","+y(p.value).toFixed(2)).join(" ");chart.append(svg("path",{d:path,fill:"none",stroke:"#d5a06a","stroke-width":2.5,"stroke-linejoin":"round","stroke-linecap":"round","pointer-events":"none"}));const l=el("span","7-day observed average");l.style.setProperty("--c","#d5a06a");$("legend").append(l)}
$("chart").append(chart,tip);
}
draw()
}
fetch("./data.json").then(r=>{if(!r.ok)throw Error("Could not load data");return r.json()}).then(x=>{db=x;init()}).catch(e=>{$("chart").append(el("div",e.message,"empty"))});
})();
</script></body></html>
