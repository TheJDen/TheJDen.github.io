<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Daymark</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;color:#283b34;background:#f8faf7}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:36px 24px 75px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:42px}.brand{font-size:21px;font-weight:700;letter-spacing:-.5px}.sub{color:#718079;font-size:13px}h1{font-size:32px;font-weight:650;letter-spacing:-1px;margin:0 0 7px}p{color:#697a70;margin:0 0 26px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:25px 0 35px}.card,.panel{border:1px solid #e4eae4;background:white;border-radius:14px}.card{padding:18px}.card .label{font-size:12px;color:#728077}.card .number{font-size:28px;font-weight:650;letter-spacing:-1px;margin:13px 0 3px}.card .date{font-size:11px;color:#849188}h2{font-size:19px;font-weight:650;letter-spacing:-.4px;margin:0}section{margin-top:30px}.section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel{padding:22px}select{border:1px solid #dbe5db;background:#fff;border-radius:8px;padding:9px 11px;color:#32483c;font:inherit;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}svg{width:100%;height:auto;display:block}.empty{padding:90px 10px;text-align:center;color:#829087}.legend,.note{font-size:12px;color:#809087;margin-top:10px}.legend{display:flex;gap:15px;flex-wrap:wrap}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{padding:15px 16px;border:1px solid #e4eae4;background:white;border-radius:11px;cursor:pointer;text-align:left;color:#34463b;font:inherit}.metric:hover,.metric:focus-visible{border-color:#a4c3ae;background:#f2f8f1}.metric strong{display:block;font-size:14px;font-weight:600}.metric small{display:block;color:#8a978e;margin-top:5px}footer{margin-top:45px;color:#89958b;font-size:12px}a{color:#547b62}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #eef1ed}th{color:#809087;font-weight:500}td:not(:first-child),th:not(:first-child){text-align:right}.tablewrap{overflow:auto}.chartbox{min-height:270px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.section-top{align-items:flex-start;flex-direction:column}.card .number{font-size:25px}}@media(max-width:430px){main{padding:25px 15px 55px}.metrics{grid-template-columns:1fr}.panel{padding:15px}}
</style></head><body><main><header><div class="brand">Open Daymark <span style="color:#83ab8b">✳</span></div><div class="sub">Personal metrics</div></header>
<h1>Overview</h1><p>My measurements and activity over time.</p>
<div id="cards" class="cards"></div>
<section><div class="section-top"><h2>History</h2><div class="controls"><select id="metric" aria-label="Metric"></select><select id="range" aria-label="Date range"><option value="all">All time</option><option value="90">90 days</option><option value="30">30 days</option></select></div></div><div class="panel"><div id="chart" class="chartbox"></div><div id="legend" class="legend"></div><div id="note" class="note"></div></div></section>
<section><div class="section-top"><h2>Recent entries</h2></div><div class="panel tablewrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></section>
<section><div class="section-top"><h2>Metrics</h2></div><div id="metrics" class="metrics"></div></section>
<footer>Open Daymark · <a href="./data.json">Data</a></footer>
</main><script>
(()=>{"use strict";const $=id=>document.getElementById(id),ns="http://www.w3.org/2000/svg",colors=["#73a586","#d6a66e","#809fc8","#b789aa"];let db,selected="weight";const el=(tag,txt,cls)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n},svg=(tag,attrs={},txt)=>{const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(txt!==undefined)n.textContent=txt;return n},fmt=(v,c)=>typeof v==="number"?v.toLocaleString("en-US",{maximumFractionDigits:c.precision??1,minimumFractionDigits:c.precision??0}):String(v),day=d=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),valid=m=>m.records.filter(r=>r.date&&r.values&&Object.values(r.values).some(v=>typeof v==="number"&&Number.isFinite(v)||typeof v==="string"&&v.trim())).sort((a,b)=>a.date.localeCompare(b.date)),metric=()=>db.metrics.find(m=>m.id===selected);
function init(){for(const id of ["weight","steps","distance","active_energy"]){const m=db.metrics.find(x=>x.id===id);if(!m)continue;const r=valid(m).at(-1),c=m.components[0],card=el("div",undefined,"card");card.append(el("div",m.label,"label"),el("div",r?fmt(r.values[c.key],c)+(c.unit==="lb"?" lb":c.unit==="mi"?" mi":c.unit==="kcal"?" kcal":""):"—","number"),el("div",r?day(r.date):"No entries","date"));$("cards").append(card)}for(const m of db.metrics){const opt=el("option",m.label);opt.value=m.id;$("metric").append(opt);const b=el("button",undefined,"metric");b.append(el("strong",m.label),el("small",valid(m).length+" entries"));b.addEventListener("click",()=>{selected=m.id;$("metric").value=m.id;$("range").value="all";render();document.getElementById("chart").scrollIntoView({behavior:"smooth",block:"center"})});$("metrics").append(b)}$("metric").value=selected;$("metric").addEventListener("change",e=>{selected=e.target.value;render()});$("range").addEventListener("change",render);render()}
function render(){const m=metric();let r=valid(m),period=$("range").value;if(period!=="all"&&r.length){const cutoff=new Date(r.at(-1).date+"T12:00:00");cutoff.setDate(cutoff.getDate()-Number(period)+1);r=r.filter(v=>new Date(v.date+"T12:00:00")>=cutoff)}$("chart").replaceChildren();$("legend").replaceChildren();$("head").replaceChildren();$("rows").replaceChildren();const tr=el("tr");tr.append(el("th","Date"));for(const c of m.components)tr.append(el("th",c.label));$("head").append(tr);for(const v of r.slice(-10).reverse()){const tr=el("tr");tr.append(el("td",day(v.date)));for(const c of m.components)tr.append(el("td",v.values[c.key]===undefined?"—":fmt(v.values[c.key],c)+(c.unit?" "+c.unit:"")));$("rows").append(tr)}$("note").textContent=r.length?r.length+" entries · "+m.source:"No entries yet";if(!r.length){$("chart").append(el("div","No data yet","empty"));return}
if(m.kind==="categorical"){const key=m.components[0].key,vals=[...new Set(r.map(v=>v.values[key]))].sort(),box=el("div");for(const v of vals){const line=el("div",v+" · "+r.filter(x=>x.values[key]===v).length+" entries");line.style.padding="10px";box.append(line)}$("chart").append(box);return}
const series=m.components.map((c,i)=>({c,color:colors[i%colors.length],pts:r.filter(v=>typeof v.values[c.key]==="number"&&Number.isFinite(v.values[c.key])).map(v=>({date:v.date,value:v.values[c.key]}))})).filter(s=>s.pts.length);if(!series.length){$("chart").append(el("div","No numeric entries","empty"));return}
const all=series.flatMap(s=>s.pts),times=all.map(p=>Date.parse(p.date+"T12:00:00")),values=all.map(p=>p.value);let low=Math.min(...values),high=Math.max(...values),spread=high-low||Math.max(1,Math.abs(high)*.1);low-=spread*.13;high+=spread*.13;const t0=Math.min(...times),t1=Math.max(...times),w=820,h=280,L=65,R=18,T=15,B=38,x=t=>L+(t0===t1?(w-L-R)/2:(t-t0)/(t1-t0)*(w-L-R)),y=v=>T+(high-v)/(high-low)*(h-T-B),chart=svg("svg",{viewBox:"0 0 820 280",role:"img","aria-label":m.label+" recorded observations"});
for(let i=0;i<5;i++){const yy=T+(h-T-B)*i/4;chart.append(svg("line",{x1:L,x2:w-R,y1:yy,y2:yy,stroke:"#e8eee8"}),svg("text",{x:L-10,y:yy+4,"text-anchor":"end",fill:"#839087","font-size":12},Number(high-(high-low)*i/4).toLocaleString("en-US",{maximumFractionDigits:1})))}for(const [t,align] of [[t0,"start"],[t1,"end"]])chart.append(svg("text",{x:align==="start"?L:w-R,y:h-9,"text-anchor":align,fill:"#839087","font-size":12},day(new Date(t).toISOString().slice(0,10))));
for(const s of series){for(const p of s.pts){const circle=svg("circle",{cx:x(Date.parse(p.date+"T12:00:00")),cy:y(p.value),r:4.2,fill:s.color});circle.append(svg("title",{},day(p.date)+": "+fmt(p.value,s.c)+" "+s.c.unit));chart.append(circle)}const l=el("span",s.c.label+" ("+s.c.unit+")");l.style.setProperty("--c",s.color);$("legend").append(l)}$("chart").append(chart)}
fetch("./data.json").then(r=>{if(!r.ok)throw Error("Could not load data");return r.json()}).then(x=>{db=x;init()}).catch(e=>{$("chart").append(el("div",e.message,"empty"))});
})();
</script></body></html>
