name: Polar nightly sync
on:
  schedule:
    - cron: "0 6,7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daymark-polar
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import Polar v4 data
        env:
          POLAR_CLIENT_ID: ${{ secrets.POLAR_CLIENT_ID }}
          POLAR_CLIENT_SECRET: ${{ secrets.POLAR_CLIENT_SECRET }}
          POLAR_AUTH_CODE: ${{ secrets.POLAR_AUTH_CODE }}
          POLAR_REFRESH_TOKEN: ${{ secrets.POLAR_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.DAYMARK_GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python daymark/polar_sync.py
      - name: Commit new public observations
        run: |
          git add daymark/data.json
          if ! git diff --cached --quiet; then
            git -c user.name="daymark-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync Polar measurements"
            git push
          fi
